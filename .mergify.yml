# This repository uses Mergify Merge Protections as its review gate.
# The configuration below is the vendor's own documented auto-merge example
# (docs.mergify.com/merge-protections/auto-merge), plus one extra rule scoped to
# the release branch.
merge_protections_settings:
  auto_merge_conditions: true
merge_protections:
  - name: require-review-and-ci
    description: main requires one approving review and green CI
    if:
      - base = main
    success_conditions:
      - "#approved-reviews-by >= 1"
      - check-success = ci

  - name: green-on-release
    description: the release branch only requires CI
    if:
      - base = release
    success_conditions:
      - check-success = ci
